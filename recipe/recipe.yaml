schema_version: 1

context:
  version: "0.5.1"

package:
  name: gdalxarray
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gdalxarray/gdalxarray-${{ version }}.tar.gz
  sha256: fb5948da8f33b20d40f5d784cc19606344aa9f46802fd992d8c476ee8b6b8cb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - packaging
    - affine
    - rasterix >=0.2,<0.3
    - xarray >=2025.6
    - numpy
    - xproj
    - gdal

tests:
  - python:
      imports:
        - gdalxarray
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: xarray extension for GDAL
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/hypertidy/gdalxarray

extra:
  recipe-maintainers:
    - mdsumner
    - ocefpaf
